name: facilitybackend

services:
  mysql:
    image: mysql:8.4
    container_name: facilitybackend-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: FacilityBackend
      MYSQL_USER: FacilityBackend
      MYSQL_PASSWORD: FacilityBackend
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - facilitybackend-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: facilitybackend-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "127.0.0.1:8081:80"

volumes:
  facilitybackend-mysql-data:
